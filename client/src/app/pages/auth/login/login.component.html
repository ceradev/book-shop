  <div class="min-h-screen py-6 flex flex-col justify-center sm:py-12">
    <div class="max-w-md mx-auto sm:max-w-xl">
      <div class="relative py-3">
      <div class="absolute inset-0 bg-gradient-to-r from-light-brown-color to-dark-brown-color shadow-lg transform -skew-y-6 sm:skew-y-0 sm:-rotate-6 sm:rounded-3xl"></div>
      <div
        class="relative px-4 py-10 bg-white shadow-lg sm:rounded-3xl sm:p-20"
      >
        <div class="max-w-md mx-auto">
          <div>
            <h1
              class="text-xl font-nunito font-semibold text-center text-shadow"
            >
              ¡Bienvenido de nuevo a la librería Eviden!
            </h1>
            <p
              class="text-sm font-nunito font-semibold text-center text-medium-brown-color"
            >
              Por favor, inicia sesión para continuar
            </p>
          </div>
          <div class="divide-y divide-gray-200">
            <div
              class="py-8 text-base leading-6 space-y-4 text-shadow sm:text-lg sm:leading-7"
            >
              <div class="relative mb-4">
                <input
                  autocomplete="off"
                  id="username"
                  name="username"
                  type="text"
                  [(ngModel)]="username"
                  class="peer placeholder-transparent font-nunito h-10 w-full border-b-2 border-light-brown-color text-shadow focus:outline-none focus:border-dark-brown-color focus:borer-rose-600"
                  placeholder="Username"
                  required
                />
                <label
                  for="username"
                  class="absolute left-0 -top-3.5 font-nunito text-shadow text-sm peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-440 peer-placeholder-shown:top-2 transition-all peer-focus:-top-3.5 peer-focus:text-gray-600 peer-focus:text-sm"
                  >Nombre de usuario</label
                >
              </div>
              <div class="relative mb-4">
                <input
                  autocomplete="off"
                  id="password"
                  name="password"
                  type="password"
                  [(ngModel)]="password"
                  class="peer placeholder-transparent h-10 w-full border-b-2 border-light-brown-color text-black focus:outline-none focus:border-dark-brown-color"
                  placeholder="Password"
                  required
                />
                <label
                  for="password"
                  class="absolute left-0 -top-3.5 font-nunito text-gray-600 text-sm peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-440 peer-placeholder-shown:top-2 transition-all peer-focus:-top-3.5 peer-focus:text-gray-600 peer-focus:text-sm"
                  >Contraseña</label
                >
              </div>
              <div class="relative">
                <button
                  (click)="onSubmit()"
                  [disabled]="isLoading"
                  class="border-2 border-medium-brown-color hover:bg-medium-brown-color hover:text-white hover:scale-105 hover:shadow-lg focus:shadow-outline focus:outline-none transition-all duration-300 ease-in-out delay-100 focus:ring-2 focus:ring-offset-2 focus:ring-dark-brown-color w-full rounded-md px-2 py-1"
                >
                @if (!isLoading) {
                  Iniciar sesion
                }@else {
                  <span class="loader"></span> Cargando...
                }
                </button>
              </div>
            </div>
            <div class="pt-6 text-center text-shadow">
              <p class="text-sm font-nunito font-semibold">
                No tienes cuenta?
                <a
                  routerLink="/register"
                  class="text-medium-brown-color hover:text-dark-brown-color transition-colors duration-300 ease-in-out delay-100"
                  >Registrate</a
                >
              </p>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
