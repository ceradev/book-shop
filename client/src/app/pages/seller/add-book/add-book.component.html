<section class="form">
    <form>
        <div class="row">
            <div class="col-md mb-4 container">
                <div class="card mb-4 shadow-md rounded p-4 border-2 border-medium-brown-color">
                    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between bg-transparent">
                        <h2 class="mb-0 text-3xl font-semibold text-dark-brown-color">Datos del libro</h2>
                    </div>
                    <div class="card-body text-medium-brown-color px-4 py-4 text-sm leading-relaxed text-justify mb-4">
                        <div class="mb-4">
                            <input type="text" id="bookTitle" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.title"
                                name="title" placeholder="Título" />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="bookIsbn" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.isbn"
                                name="isbn" placeholder="ISBN" />
                        </div>

                        <div class="mb-3">
                            <input type="text" id="bookAuthor" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.authorFirstName"
                                name="author" placeholder="Nombre del autor" />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="bookAuthor" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.authorLastName"
                                name="author" placeholder="Apellidos del autor" />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="bookEditorial" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.editorial"
                                name="editorial" placeholder="Editorial" />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="bookEditorial" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.edition"
                                name="editorial" placeholder="Edición" />
                        </div>

                        <hr class="my-4" />

                        <!-- text precio -->
                        <div class="mb-3">
                            <input type="text" id="bookPrice" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.price"
                                name="price" placeholder="Precio" />
                        </div>

                        <!-- text inferior fecha de publicación, unidades en venta -->
                        <div class="mb-3">
                            <input type="date" id="bookDate" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline"  [(ngModel)]="bookData.publishDate"
                                name="publishDate" placeholder="Fecha de publicación" />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="bookStock" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.stock"
                                name="bookStock" placeholder="Stock" />
                                 

                        </div>
                        <!-- text sipnosis -->
                        <div class="mb-3">
                            <textarea id="bookSynopsis" class="shadow appearance-none border-2 border-medium-brown-color rounded w-full py-2 px-3 text-medium-brown-color leading-tight focus:outline-none focus:shadow-outline" [(ngModel)]="bookData.synopsis"
                                name="synopsis" placeholder="Sipnosis"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md mb-4 container">
                <div class="card mb-4 border-2 border-medium-brown-color rounded-lg shadow-md">
                    <div class="card-body p-4">
                        <!-- image input -->
                        <div class="flex flex-col items-center justify-center mb-4 w-full">
                            <h3 class="mb-4 text-dark-brown-color text-center text-3xl font-semibold">Imagen de Portada</h3>
                            <div class="flex justify-center">
                                <div class="flex justify-center" *ngIf="imageExist()">
                                    <img [src]="imageUrl" alt="" style="max-height: 300px; max-width: 300px;" class="max-w-sm"/>
                                </div>
                            </div>
                            <div class="flex justify-center mb-4">
                                <label class="border-2 border-medium-brown-color hover:bg-medium-brown-color hover:text-white hover:scale-105 hover:shadow-lg  focus:shadow-outline focus:outline-none transition-all duration-300 ease-in-out py-2 px-4 rounded-full cursor-pointer">
                                    Subir imagen
                                    <input type="file" class="hidden" accept="image/png, image/jpeg" (change)="onFileSelected($event)"/>
                                </label>
                            </div>
                        </div>
                        <hr class="my-4" />
                        <!-- checkbox generos -->
                        <h3 class="mb-4 text-dark-brown-color text-center text-3xl font-semibold">Generos</h3>
                        <div class="flex flex-wrap -mx-2">
                            <div class="px-2 mb-4 w-full" *ngFor="let genre of genres">
                                <label class="flex items-center">
                                    <input type="checkbox" class="form-checkbox" name="genre" value="{{genre.id}}">
                                    <span class="ml-2 text-medium-brown-color">{{genre.name}}</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
       
        <div class="flex justify-center mt-10">
            <button class="border-2 border-medium-brown-color hover:bg-medium-brown-color hover:text-white hover:scale-105 hover:shadow-lg  focus:shadow-outline focus:outline-none transition-all duration-300 ease-in-out py-3 px-8 rounded-full" (click)="newBook()">Mandar libro a revisión</button>
        </div>
    </div>
</form>
