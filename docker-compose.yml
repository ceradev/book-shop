services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: libreria
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    command: [ 'start-dev', '--import-realm' ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456
      KC_DB_URL: jdbc:postgresql://postgres:5432/libreria
    ports:
      - "9099:8080"
    volumes:
      - keycloak-data:/opt/jboss/keycloak/data
      - ./realms-export.json:/opt/jboss/keycloak/data/realms-export.json
    depends_on:
      - postgres

volumes:
  postgres-data: {}
  keycloak-data: {}
